# perm.manifest.yaml — sumber kebenaran permissions & menu service ini.
# Self-sync otomatis ke Permission Service setiap kali service boot (idempotent).
service:
  name: web-management
  description: "Binawan Web Management (BWM) — CMS headless untuk web Universitas Binawan: konten, media, dokumen, taksonomi, SEO"
  base_url: ""
  sync_enabled: true

permissions:
  # Konten (post/page/event/banner/slider)
  - permission: contents.read
    description: Lihat semua konten web (draft & published)
  - permission: contents.write
    description: Kelola konten web (buat/edit draft, publish, arsip)
  # Media library (MinIO)
  - permission: media.read
    description: Lihat media library
  - permission: media.write
    description: Upload & kelola media
  # Pengaturan & taksonomi (dipakai mulai F2)
  - permission: settings.write
    description: Kelola pengaturan web, taksonomi & redirect

menu:
  - label: "Web Management"
    path: /dashboard/web-management
    icon: Globe
    sort_order: 40
    children:
      - label: Konten Web
        path: /dashboard/web-management/posts
        icon: FileText
        required_permission: contents.read
        sort_order: 1
      - label: Media Library
        path: /dashboard/web-management/media
        icon: Image
        required_permission: media.read
        sort_order: 2
      - label: Event Kampus
        path: /dashboard/web-management/events
        icon: CalendarDays
        required_permission: contents.read
        sort_order: 3
      - label: Redirect URL
        path: /dashboard/web-management/redirects
        icon: Link2
        required_permission: settings.read
        sort_order: 7
      - label: Halaman Statis
        path: /dashboard/web-management/pages
        icon: FileText
        required_permission: contents.read
        sort_order: 4
      - label: Banner Slider
        path: /dashboard/web-management/banners
        icon: Image
        required_permission: contents.read
        sort_order: 5
      - label: Dokumen
        path: /dashboard/web-management/documents
        icon: FileText
        required_permission: contents.read
        sort_order: 6
