server:
  port: 8083
  host: "0.0.0.0"
  read_timeout: 30s
  write_timeout: 30s
  shutdown_timeout: 10s
  max_body_size: 10485760  # 10MB

database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres"
  dbname: "iku_db"
  sslmode: "disable"
  max_open_conns: 100
  max_idle_conns: 10
  conn_max_lifetime: 1h

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  pool_size: 10
  min_idle_conns: 5

jwt:
  secret: "your-super-secret-jwt-key-change-this-in-production"  # MUST match SSO JWT_SECRET
  access_expiration: 1h

sso:
  url: "http://localhost:8080"
  permission_service_url: "http://localhost:8082"
  service_name: "iku"
  service_client_id: ""
  service_client_secret: ""

logger:
  level: "info"
  format: "json"

cors:
  allowed_origins:
    - "http://localhost:3002"
  allow_credentials: true
  max_age: 86400
