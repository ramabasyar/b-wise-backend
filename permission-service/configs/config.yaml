server:
  port: 8081
  host: "0.0.0.0"
  read_timeout: 30s
  write_timeout: 30s
  shutdown_timeout: 10s
  max_body_size: 10485760  # 10MB

database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres"
  dbname: "permission-service_db"
  sslmode: "disable"
  max_open_conns: 100
  max_idle_conns: 10
  conn_max_lifetime: 1h

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  pool_size: 10
  min_idle_conns: 5

jwt:
  secret: "your-super-secret-jwt-key-change-this-in-production"  # MUST match Permission Service JWT secret
  access_expiration: 1h
  refresh_expiration: 24h

sso:
  url: "http://localhost:8080"
  service_account_email: "service@starterpermission-service.io"
  service_account_password: "changeme"
  cache_enabled: true
  cache_ttl: 15m

logger:
  level: "info"
  format: "json"

cors:
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:3002"  # B-Wise admin portal (Next.js dev)
    - "http://localhost:8081"  # Permission Service
    - "https://myapp.com"
    - "https://admin.myapp.com"
  allow_credentials: true
  max_age: 86400
